<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورقة الشواهد</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9e7e2;--bar:#fff;--ink:#222;--accent:#1f7a72}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2a2a;--bar:#3a3a3a;--ink:#eee}}
:root[data-theme="dark"]{--bg:#2a2a2a;--bar:#3a3a3a;--ink:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:var(--bar);box-shadow:0 1px 4px #0003}
.bar button{font:inherit;padding:8px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.bar button.alt{background:#777}
#wrap{margin:12px auto;transform-origin:top center}
.page{position:relative;width:210mm;height:297mm;background:#fff;overflow:hidden;margin:0 auto;box-shadow:0 2px 12px #0004}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#text{position:absolute;top:15.5%;right:7%;left:7%;height:9%;font-size:18pt;line-height:1.9;color:#000;outline:none;overflow:hidden;white-space:pre-wrap}
#text:empty:before{content:"اكتب هنا…";color:#aaa}
.grid{position:absolute;top:25.5%;right:7%;left:7%;height:42%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2mm;border:0.6mm solid #1f7a72;background:#1f7a72}
.cell{position:relative;background:#fff;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#999;font-size:12pt}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell input{display:none}
.cell .x{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:#c00;color:#fff;font-size:16px;line-height:1;cursor:pointer}
@page{size:A4;margin:0}
@media print{
 html,body{background:#fff;padding:0;margin:0}
 .bar{display:none}
 #wrap{transform:none!important;margin:0!important;height:auto!important}
 .page{box-shadow:none;margin:0}
 .cell .x,.cell .ph{display:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>
const grid=document.getElementById('grid');
for(let i=0;i<4;i++){
 const c=document.createElement('label');c.className='cell';
 c.innerHTML='<span class="ph">+ إضافة صورة</span><input type="file" accept="image/*">';
 c.querySelector('input').addEventListener('change',e=>load(e.target,c));
 grid.appendChild(c);
}
function load(inp,c){
 const f=inp.files[0];if(!f)return;
 const url=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{
  const m=1400,s=Math.min(1,m/Math.max(im.width,im.height));
  const cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
  set(c,cv.toDataURL('image/jpeg',.85));URL.revokeObjectURL(url);inp.value='';
 };
 im.src=url;
}
function set(c,src){
 c.querySelectorAll('img,.x').forEach(n=>n.remove());
 c.querySelector('.ph').style.display='none';
 const i=document.createElement('img');i.src=src;c.appendChild(i);
 const x=document.createElement('button');x.className='x';x.textContent='×';
 x.onclick=e=>{e.preventDefault();e.stopPropagation();i.remove();x.remove();c.querySelector('.ph').style.display='';};
 c.appendChild(x);
}
function clearImgs(){document.querySelectorAll('.cell').forEach(c=>{c.querySelectorAll('img,.x').forEach(n=>n.remove());c.querySelector('.ph').style.display='';});}
let size=18;
function fs(d){size=Math.max(10,Math.min(36,size+d));document.getElementById('text').style.fontSize=size+'pt';}
function fit(){
 const w=document.getElementById('wrap'),p=document.getElementById('page');
 const pw=p.offsetWidth,ph=p.offsetHeight,s=Math.min(1,(window.innerWidth-16)/pw);
 w.style.width=pw+'px';w.style.transform='scale('+s+')';w.style.height=(ph*s)+'px';
 w.style.marginLeft=w.style.marginRight='auto';
 if(s<1){w.style.transformOrigin='top right';w.style.marginRight=((window.innerWidth-pw*s)/2)+'px';w.style.marginLeft='0';}
}
window.addEventListener('resize',fit);window.addEventListener('load',fit);fit();
window.addEventListener('beforeprint',()=>{const w=document.getElementById('wrap');w.dataset.s=w.style.transform;});
</script>
</body>
